<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#grid)"/>
  <circle cx="300" cy="380" r="280" fill="url(#halo)"/>

  <!-- Agile PM Kanban / Matrix Graphic -->
  <g transform="translate(300, 390)">
    <rect x="-130" y="-100" width="70" height="180" rx="6" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="-35" y="-100" width="70" height="180" rx="6" fill="none" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="60" y="-100" width="70" height="180" rx="6" fill="none" stroke="#a5b4fc" stroke-opacity="0.25" stroke-width="1.5"/>
    
    <!-- Mini Cards inside columns -->
    <rect x="-120" y="-80" width="50" height="35" rx="3" fill="#6366f1" fill-opacity="0.25"/>
    <rect x="-120" y="-35" width="50" height="45" rx="3" fill="#6366f1" fill-opacity="0.15"/>
    <rect x="-25" y="-80" width="50" height="50" rx="3" fill="#818cf8" fill-opacity="0.35"/>
    <rect x="-25" y="-20" width="50" height="30" rx="3" fill="#818cf8" fill-opacity="0.2"/>
    <rect x="70" y="-80" width="50" height="40" rx="3" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="70" y="-30" width="50" height="40" rx="3" fill="#a5b4fc" fill-opacity="0.2"/>

    <circle cx="0" cy="0" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="#6366f1" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="8,6"/>
  </g>

  <path d="M 80,620 L 220,620 L 260,650 L 520,650" fill="none" stroke="#6366f1" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="80" cy="620" r="4" fill="#6366f1" fill-opacity="0.5"/>
  <circle cx="520" cy="650" r="4" fill="#6366f1" fill-opacity="0.5"/>
</svg>
