<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c14"/>
      <stop offset="50%" stop-color="#03100b"/>
      <stop offset="100%" stop-color="#010705"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#grid)"/>
  <circle cx="300" cy="380" r="280" fill="url(#halo)"/>

  <!-- Mobile App Frame / Hexagon Geometry -->
  <g transform="translate(300, 390)">
    <rect x="-65" y="-115" width="130" height="230" rx="20" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="-55" y="-105" width="110" height="210" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <line x1="-20" y1="-95" x2="20" y2="-95" stroke="#10b981" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="85" r="8" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Concentric Hexagon Shield -->
    <polygon points="0,-140 120,-70 120,70 0,140 -120,70 -120,-70" fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8,4"/>
    <circle cx="0" cy="0" r="175" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  </g>

  <path d="M 70,610 L 210,610 L 250,640 L 490,640" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="70" cy="610" r="4" fill="#10b981" fill-opacity="0.5"/>
  <circle cx="490" cy="640" r="4" fill="#10b981" fill-opacity="0.5"/>
</svg>
