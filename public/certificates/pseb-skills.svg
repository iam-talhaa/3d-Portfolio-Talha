<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26"/>
      <stop offset="50%" stop-color="#040f16"/>
      <stop offset="100%" stop-color="#02070a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#grid)"/>
  <circle cx="300" cy="380" r="280" fill="url(#halo)"/>

  <!-- Network / Global Comm Nodes -->
  <g transform="translate(300, 390)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="100" ry="40" fill="none" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="40" ry="100" fill="none" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1.5"/>
    
    <!-- Nodes -->
    <circle cx="0" cy="-100" r="6" fill="#06b6d4" fill-opacity="0.6"/>
    <circle cx="0" cy="100" r="6" fill="#06b6d4" fill-opacity="0.6"/>
    <circle cx="-100" cy="0" r="6" fill="#06b6d4" fill-opacity="0.6"/>
    <circle cx="100" cy="0" r="6" fill="#06b6d4" fill-opacity="0.6"/>
    <circle cx="0" cy="0" r="10" fill="#22d3ee" fill-opacity="0.5"/>

    <circle cx="0" cy="0" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <circle cx="0" cy="0" r="185" fill="none" stroke="#06b6d4" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="6,6"/>
  </g>

  <path d="M 80,630 L 230,630 L 270,660 L 510,660" fill="none" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="80" cy="630" r="4" fill="#06b6d4" fill-opacity="0.5"/>
  <circle cx="510" cy="660" r="4" fill="#06b6d4" fill-opacity="0.5"/>
</svg>
