<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e0e"/>
      <stop offset="50%" stop-color="#0e0707"/>
      <stop offset="100%" stop-color="#060202"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#be123c" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#grid)"/>
  <circle cx="300" cy="380" r="280" fill="url(#halo)"/>

  <!-- Shield / Crest Geometry -->
  <g transform="translate(300, 390)">
    <path d="M 0,-120 L 90,-70 L 90,40 Q 90,120 0,150 Q -90,120 -90,40 L -90,-70 Z" fill="none" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M 0,-95 L 70,-55 L 70,35 Q 70,95 0,120 Q -70,95 -70,35 L -70,-55 Z" fill="#f43f5e" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

    <!-- Certified Star Motif -->
    <polygon points="0,-40 10,-10 40,-10 16,10 24,38 0,20 -24,38 -16,10 -40,-10 -10,-10" fill="#f43f5e" fill-opacity="0.5"/>
    <circle cx="0" cy="0" r="165" fill="none" stroke="#f43f5e" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="6,6"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  </g>

  <path d="M 500,600 L 370,600 L 330,640 L 110,640" fill="none" stroke="#f43f5e" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="500" cy="600" r="4" fill="#f43f5e" fill-opacity="0.5"/>
  <circle cx="110" cy="640" r="4" fill="#f43f5e" fill-opacity="0.5"/>
</svg>
