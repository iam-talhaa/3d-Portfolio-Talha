<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#grid)"/>
  <circle cx="300" cy="380" r="280" fill="url(#halo)"/>

  <!-- Scrum Cycle Geometry -->
  <g transform="translate(300, 390)">
    <!-- Circular Sprint Arrow -->
    <path d="M 0,-120 A 120 120 0 1 1 -110,40" fill="none" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2.5" stroke-dasharray="10,6"/>
    <path d="M 0,-90 A 90 90 0 1 0 85,30" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <polygon points="-110,40 -125,18 -95,28" fill="#f59e0b" fill-opacity="0.6"/>
    
    <!-- Inner emblem -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
    <polygon points="0,-25 22,12 -22,12" fill="#f59e0b" fill-opacity="0.25"/>
    
    <circle cx="0" cy="0" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <circle cx="0" cy="0" r="195" fill="none" stroke="#f59e0b" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4,8"/>
  </g>

  <path d="M 500,580 L 380,580 L 340,630 L 120,630" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="500" cy="580" r="4" fill="#f59e0b" fill-opacity="0.5"/>
  <circle cx="120" cy="630" r="4" fill="#f59e0b" fill-opacity="0.5"/>
</svg>
